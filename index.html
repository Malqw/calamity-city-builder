<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Билдер отрядов Calamity City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#eef0e6; --surface:#ffffff; --surface-2:#e3e6d7; --surface-3:#d5d9c4;
    --border:#c4c9b0; --text:#1b1f14; --text-muted:#5e6350;
    --accent:#4f6b34; --accent-strong:#3c5427; --accent-ink:#f7f9ef;
    --warn:#8a6112; --warn-bg:#f5ead0; --danger:#a8341f; --danger-bg:#f6ded7;
    --good:#2f6b41; --good-bg:#dcead9;
    --shadow:0 1px 2px rgba(20,24,12,.08), 0 4px 14px rgba(20,24,12,.07);
    --radius:10px; --radius-sm:6px;
    --font-display:'Big Shoulders Display',system-ui,sans-serif;
    --font-body:'Public Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14170f; --surface:#1c2116; --surface-2:#242a1b; --surface-3:#2e3423;
      --border:#3b4130; --text:#eceee2; --text-muted:#9ba189;
      --accent:#8fbf62; --accent-strong:#a6d47d; --accent-ink:#12160c;
      --warn:#dba848; --warn-bg:#3a3117; --danger:#e2765a; --danger-bg:#3a211a;
      --good:#7fc496; --good-bg:#1e3325;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14170f; --surface:#1c2116; --surface-2:#242a1b; --surface-3:#2e3423;
    --border:#3b4130; --text:#eceee2; --text-muted:#9ba189;
    --accent:#8fbf62; --accent-strong:#a6d47d; --accent-ink:#12160c;
    --warn:#dba848; --warn-bg:#3a3117; --danger:#e2765a; --danger-bg:#3a211a;
    --good:#7fc496; --good-bg:#1e3325;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); padding-inline:16px; padding-block:0 32px; }
  h1,h2,h3{ font-family:var(--font-display); font-weight:800; text-wrap:balance; letter-spacing:.2px; margin:0; }
  .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  a{ color:var(--accent-strong); }
  button, select, input{ font-family:var(--font-body); font-size:14px; }
  button{ cursor:pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  [hidden]{ display:none!important; }

  .wrap{ max-width:1080px; margin:0 auto; }

  /* top bar */
  .topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding-block:14px 10px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .topbar-inner{ max-width:1080px; margin:0 auto; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  .brand{ font-size:22px; line-height:1; }
  .brand small{ display:block; font-family:var(--font-body); font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-top:3px; }
  .tabs{ display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; }
  .tab-btn{ border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px; padding:7px 14px; font-weight:600; font-size:13px; }
  .tab-btn[aria-selected="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  section.view{ display:flex; flex-direction:column; gap:18px; }

  /* summary strip */
  .summary{ display:grid; grid-template-columns:1.4fr repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  @media (max-width:720px){ .summary{ grid-template-columns:1fr 1fr; } }
  .summary > div{ background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:4px; justify-content:center; }
  .summary .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); font-weight:600; }
  .summary .value{ font-family:var(--font-mono); font-size:19px; font-weight:600; }
  .summary .name-cell input{ font-family:var(--font-display); font-size:19px; font-weight:700; border:none; background:transparent; color:var(--text); padding:0; width:100%; }
  .summary .name-cell input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .budget-edit{ display:flex; align-items:center; gap:4px; }
  .budget-edit input{ width:52px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); padding:2px 5px; font-family:var(--font-mono); }
  .pill{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; }
  .pill.good{ background:var(--good-bg); color:var(--good); }
  .pill.danger{ background:var(--danger-bg); color:var(--danger); }
  .pill.warn{ background:var(--warn-bg); color:var(--warn); }

  .issues{ display:flex; flex-direction:column; gap:6px; }
  .issue{ font-size:13px; padding:8px 12px; border-radius:var(--radius-sm); background:var(--warn-bg); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
  .issue.danger{ background:var(--danger-bg); color:var(--danger); }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn{ border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:var(--radius-sm); padding:8px 13px; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ background:var(--accent-strong); }
  .btn.ghost{ background:transparent; }
  .btn.small{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .add-menu{ position:relative; display:inline-block; }
  .add-dropdown{ position:absolute; top:calc(100% + 4px); left:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:var(--shadow); min-width:220px; z-index:30; padding:4px; }
  .add-dropdown button{ display:flex; justify-content:space-between; gap:8px; width:100%; text-align:left; border:none; background:transparent; padding:8px 10px; border-radius:var(--radius-sm); color:var(--text); font-size:13px; }
  .add-dropdown button:hover:not(:disabled){ background:var(--surface-2); }
  .add-dropdown button:disabled{ opacity:.4; cursor:not-allowed; }
  .add-dropdown .cap{ color:var(--text-muted); font-family:var(--font-mono); font-size:12px; }

  /* unit card */
  .unit{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .unit-head{ background:var(--surface-2); padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .unit-head input.uname{ font-family:var(--font-display); font-weight:700; font-size:18px; background:transparent; border:none; color:var(--text); min-width:0; flex:1 1 180px; }
  .unit-head input.uname:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .role-tag{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--text-muted); background:var(--surface); border:1px solid var(--border); padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .size-select{ border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:4px 6px; color:var(--text); font-family:var(--font-mono); }
  .unit-cost{ font-family:var(--font-mono); font-weight:700; font-size:16px; margin-left:auto; }
  .unit-body{ padding:16px; display:flex; flex-direction:column; gap:16px; }

  .stat-row{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  @media (max-width:720px){ .stat-row{ grid-template-columns:repeat(3,1fr); } }
  .stat-box{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px; text-align:center; background:var(--surface); }
  .stat-box .sname{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600; }
  .stat-box .sval{ font-family:var(--font-mono); font-size:18px; font-weight:700; margin:4px 0; }
  .stat-box .stepper{ display:flex; justify-content:center; gap:4px; }
  .stepper button{ width:22px; height:22px; border-radius:5px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); line-height:1; font-weight:700; padding:0; }
  .stepper button:disabled{ opacity:.35; }

  .derived-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  @media (max-width:520px){ .derived-row{ grid-template-columns:repeat(2,1fr); } }
  .derived-box{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px; text-align:center; background:var(--surface-3); }
  .derived-box .dname{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600; }
  .derived-box .dval{ font-family:var(--font-mono); font-size:17px; font-weight:700; }

  .note-inline{ font-size:12px; color:var(--text-muted); }

  .section-h{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--text-muted); margin-bottom:6px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .two-col{ grid-template-columns:1fr; } }

  .check-list{ display:flex; flex-direction:column; gap:4px; max-height:210px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px; background:var(--surface); }
  .check-item{ display:flex; align-items:flex-start; gap:7px; padding:5px 6px; border-radius:5px; font-size:12.5px; line-height:1.35; }
  .check-item:hover{ background:var(--surface-2); }
  .check-item input{ margin-top:3px; flex:none; }
  .check-item .it-name{ font-weight:600; }
  .check-item .it-meta{ color:var(--text-muted); }
  .check-item.disabled{ opacity:.4; }
  .check-item .cost-chip{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); white-space:nowrap; }

  select.armor-select{ width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 8px; background:var(--surface); color:var(--text); }

  .unit-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding-top:10px; border-top:1px dashed var(--border); }
  .slot-meter{ font-family:var(--font-mono); font-size:12px; color:var(--text-muted); }
  .slot-meter.over{ color:var(--danger); font-weight:700; }

  /* glossary / rules card */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
  .glossary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; font-size:12.5px; }
  @media (max-width:640px){ .glossary-grid{ grid-template-columns:1fr; } }
  .glossary-grid dt{ font-weight:700; margin-top:6px; }
  .glossary-grid dd{ margin:0 0 4px 0; color:var(--text-muted); }

  .rule-list{ display:flex; flex-direction:column; gap:8px; font-size:13px; }
  .rule-list b{ color:var(--text); }

  /* my squads */
  .squad-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); flex-wrap:wrap; }
  .squad-row .sn{ font-weight:700; flex:1 1 160px; }
  .squad-row .meta{ font-size:12px; color:var(--text-muted); font-family:var(--font-mono); }

  /* admin */
  .admin-entity{ display:grid; grid-template-columns:1.3fr .6fr 2fr; gap:8px; align-items:center; padding:8px 4px; border-bottom:1px solid var(--border); font-size:12.5px; }
  @media (max-width:640px){ .admin-entity{ grid-template-columns:1fr; } }
  .admin-entity input, .admin-entity select{ width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:5px 7px; background:var(--surface); color:var(--text); }
  .admin-group h3{ font-size:16px; margin:20px 0 6px; }
  .admin-group h3:first-child{ margin-top:0; }
  .save-bar{ position:sticky; bottom:0; background:var(--bg); padding-block:10px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:center; }

  .empty-note{ font-size:13px; color:var(--text-muted); padding:20px; text-align:center; }
  .footer-note{ font-size:11.5px; color:var(--text-muted); text-align:center; padding-top:10px; }
  .data-banner{ font-size:12.5px; padding:8px 12px; border-radius:var(--radius-sm); margin-bottom:10px; }
  .data-banner.offline{ background:var(--warn-bg); color:var(--warn); }
  .id-bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .id-bar input{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 9px; background:var(--surface); color:var(--text); font-size:13px; }
  .id-bar .note-inline{ font-size:11.5px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">Билдер отрядов<small>Calamity City &middot; варгейм в разработке</small></div>
    <div class="tabs" role="tablist">
      <button class="tab-btn" data-tab="builder" onclick="App.setTab('builder')" aria-selected="true">Билдер</button>
      <button class="tab-btn" data-tab="mine" onclick="App.setTab('mine')" aria-selected="false">Мои отряды</button>
    </div>
  </div>
</div>

<div class="wrap">

</div>

var DIE_ORDER = ['d6','d8','d10','d12'];

/* ---------------------------------------------------------- COMPUTE ---- */

function currentArchetype(){ return data().archetypes[state.archetype]; }
function role(unit){ return currentArchetype().roles[unit.roleId]; }
function roleCategories(r){ return r.archetypeCategories || currentArchetype().archetypeCategories; }

function statIncreasesUsed(unit){
  var d = data(); var r = role(unit); var used = 0;
  STAT_KEYS.forEach(function(k){
    var baseline = (k==='might' && r.mightBaseline) ? r.mightBaseline : 'd6';
    used += Math.max(0, dieIdx(unit.stats[k]) - dieIdx(baseline));
  });
  return used;
}

function weaponSlot(w){ return w.twohanded ? 2 : 1; }

function computeUnit(unit){
  var d = data(); var r = role(unit); var arch = currentArchetype();
  var sizeBonus = (arch.sizeBonusRule && unit.size===arch.sizeBonusRule.size) ? arch.sizeBonusRule : null;
  var defence = 4;
  if(dieIdx(unit.stats.fight) >= 1) defence += 1;
  if(dieIdx(unit.stats.agility) >= 1) defence += 1;

  var armor = (r.builtinArmor||0) + (sizeBonus ? (sizeBonus.armor||0) : 0);
  unit.equipment.forEach(function(eid){ var e=d.equipment[eid]; if(e){ if(e.group==='armor') armor += (e.armorBonus||0); if(e.armorBonusExtra) armor += e.armorBonusExtra; } });

  var health = 2 + (r.builtinHealth||0) + (sizeBonus ? (sizeBonus.health||0) : 0);
  STAT_KEYS.forEach(function(k){ var i=dieIdx(unit.stats[k]); if(i>=1) health+=1; if(i>=3) health+=1; });
  if(unit.size===1) health -= 1; if(unit.size===3) health += 1;
  unit.archetypeAbilities.concat(unit.anyAbilities).forEach(function(aid){ if(aid==='zdorovyak') health += 1; });

  var speed = r.speedCapped ? 5 : (5 + (dieIdx(unit.stats.agility)>=2?1:0));

  var slotsCap = 3;
  unit.equipment.forEach(function(eid){ var e=d.equipment[eid]; if(e && e.grantsSlot) slotsCap += e.grantsSlot; });
  unit.archetypeAbilities.concat(unit.anyAbilities).forEach(function(aid){ if(aid==='zdorovyak') slotsCap += 1; if(aid==='born_wrestler') slotsCap += 1; });

  var slotsUsed = 0; var cost = r.cost;
  unit.rangedWeapons.concat(unit.meleeWeapons).forEach(function(wid){ var w=d.weapons[wid]; if(w){ slotsUsed += weaponSlot(w); cost += w.cost; } });
  unit.equipment.forEach(function(eid){ var e=d.equipment[eid]; if(e){ slotsUsed += (e.slot||0); cost += (e.cost||0); } });

  return { defence:defence, armor:armor, health:health, speed:speed, slotsCap:slotsCap, slotsUsed:slotsUsed, cost:cost,
    increasesUsed: statIncreasesUsed(unit), increasesAllowed: r.statIncreases };
}

function squadTotals(){
  var d = data(); var totalCost = 0; var counts = {}; var seniorSum = 0; var noviceSum = 0;
  var uniqueUsage = {};
  var roles = currentArchetype().roles;
  state.units.forEach(function(u){
    var c = computeUnit(u);
    totalCost += c.cost;
    counts[u.roleId] = (counts[u.roleId]||0)+1;
    var r = roles[u.roleId];
    if(r){ if(r.tier==='senior') seniorSum++; if(r.tier==='novice') noviceSum++; }
    u.rangedWeapons.concat(u.meleeWeapons).forEach(function(wid){ var w=d.weapons[wid]; if(w && w.uniqueMax) uniqueUsage[wid]=(uniqueUsage[wid]||0)+1; });
    u.equipment.forEach(function(eid){ var e=d.equipment[eid]; if(e && e.uniqueMax) uniqueUsage[eid]=(uniqueUsage[eid]||0)+1; });
  });
  return { totalCost:totalCost, counts:counts, uniqueUsage:uniqueUsage, seniorSum:seniorSum, noviceSum:noviceSum };
}

function squadIssues(){
  var t = squadTotals(); var d = data(); var roles = currentArchetype().roles; var issues = [];
  var commanderCount = t.counts.commander||0;
  if(commanderCount !== 1) issues.push({level:'danger', text:'В отряде должен быть ровно 1 Командир (сейчас '+commanderCount+').'});
  Object.keys(roles).forEach(function(rid){
    var r = roles[rid]; var count = t.counts[rid]||0;
    if(count > r.maxCount) issues.push({level:'danger', text:'«'+r.name+'» больше лимита ('+r.maxCount+').'});
  });
  if(t.noviceSum > t.seniorSum) issues.push({level:'danger', text:'Новобранцев/Тяжёлых Новобранцев ('+t.noviceSum+') больше, чем Командир+Ветераны ('+t.seniorSum+').'});
  if(t.totalCost > state.budget) issues.push({level:'danger', text:'Превышен бюджет: '+t.totalCost+' / '+state.budget+' Известности.'});
  Object.keys(t.uniqueUsage).forEach(function(id){
    var item = d.weapons[id] || d.equipment[id];
    if(item && t.uniqueUsage[id] > item.uniqueMax) issues.push({level:'danger', text:'«'+item.name+'» превышает лимит на отряд ('+item.uniqueMax+').'});
  });
  state.units.forEach(function(u){
    var c = computeUnit(u);
    if(c.slotsUsed > c.slotsCap) issues.push({level:'warn', text:'«'+u.name+'»: занято слотов больше, чем есть ('+c.slotsUsed+'/'+c.slotsCap+').'});
    if(c.increasesUsed > c.increasesAllowed) issues.push({level:'warn', text:'«'+u.name+'»: потрачено больше прокачек, чем разрешено.'});
  });
  return issues;
}

App.addUnit = function(roleId){
  var r = currentArchetype().roles[roleId];
  var stats = {}; STAT_KEYS.forEach(function(k){ stats[k] = (k==='might' && r.mightBaseline) ? r.mightBaseline : 'd6'; });
  var count = state.units.filter(function(u){return u.roleId===roleId;}).length;
  setState(function(s){
    s.units.push({ id:uid(), roleId:roleId, name:r.name+' '+(count+1), size:r.defaultSize, stats:stats,
      archetypeAbilities:[], anyAbilities:[], rangedWeapons:[], meleeWeapons:[], equipment:[] });
  });
  document.getElementById('add-dropdown').hidden = true;
};

App.removeUnit = function(id){
  if(!confirm('Убрать этого бойца из отряда?')) return;
  setState(function(s){ s.units = s.units.filter(function(u){ return u.id!==id; }); });
};

App.renameUnit = function(id, name){
  var u = state.units.find(function(u){return u.id===id;});
  if(u) u.name = name;
  persistHot();
};

App.setSize = function(id, size){
  var u = state.units.find(function(u){return u.id===id;});
  if(u) u.size = parseInt(size,10);
  renderAll();
};

App.stepStat = function(id, key, dir){
  var u = state.units.find(function(u){return u.id===id;});
  if(!u) return;
  var r = role(u);
  var i = dieIdx(u.stats[key]);
  var baseline = (key==='might' && r.mightBaseline) ? r.mightBaseline : 'd6';
  if(dir>0){
    if(i>=3) return;
    if(statIncreasesUsed(u) >= r.statIncreases) return;
    u.stats[key] = DIE_ORDER[i+1];
  } else {
    if(dieIdx(u.stats[key]) <= dieIdx(baseline)) return;
    u.stats[key] = DIE_ORDER[i-1];
  }
  renderAll();
};

App.toggleAbility = function(unitId, slotType, abilityId, checked){
  var u = state.units.find(function(u){return u.id===unitId;});
  if(!u) return;
  var r = role(u);
  var list = slotType==='archetype' ? u.archetypeAbilities : u.anyAbilities;
  var maxSlots = slotType==='archetype' ? r.archetypeAbilitySlots : r.anyAbilitySlots;
  var otherList = slotType==='archetype' ? u.anyAbilities : u.archetypeAbilities;
  if(checked){
    if(otherList.indexOf(abilityId)!==-1) return;
    if(list.length >= maxSlots) return;
    list.push(abilityId);
  } else {
    var idx = list.indexOf(abilityId);
    if(idx!==-1) list.splice(idx,1);
  }
  renderAll();
};

App.toggleWeapon = function(unitId, kind, weaponId, checked){
  var u = state.units.find(function(u){return u.id===unitId;});
  if(!u) return;
  var d = data();
  var key = kind==='ranged' ? 'rangedWeapons' : 'meleeWeapons';
  var w = d.weapons[weaponId];
  if(checked){
    if(!factionOk(w)) return;
    if(w.reqStrength && dieIdx(u.stats.might) < dieIdx(w.reqStrength)) return;
    if(w.uniqueMax){
      var used = 0;
      state.units.forEach(function(uu){ if(uu.rangedWeapons.concat(uu.meleeWeapons).indexOf(weaponId)!==-1) used++; });
      if(used >= w.uniqueMax) return;
    }
    if(w.twohanded){ u[key] = [weaponId]; }
    else {
      var hasTwoHanded = u[key].some(function(id){ var ww=d.weapons[id]; return ww && ww.twohanded; });
      if(hasTwoHanded) u[key] = [];
      if(u[key].length >= 2) return;
      u[key].push(weaponId);
    }
  } else {
    u[key] = u[key].filter(function(id){ return id!==weaponId; });
  }
  renderAll();
};

App.toggleEquipment = function(unitId, equipId, checked){
  var u = state.units.find(function(u){return u.id===unitId;});
  if(!u) return;
  var d = data(); var e = d.equipment[equipId];
  if(checked){
    if(!factionOk(e)) return;
    if(e.reqStrength && dieIdx(u.stats.might) < dieIdx(e.reqStrength)) return;
    if(e.uniqueMax){
      var used = 0;
      state.units.forEach(function(uu){ if(uu.equipment.indexOf(equipId)!==-1) used++; });
      if(used >= e.uniqueMax) return;
    }
    if(u.equipment.indexOf(equipId)===-1) u.equipment.push(equipId);
  } else {
    u.equipment = u.equipment.filter(function(id){ return id!==equipId; });
  }
  renderAll();
};

App.setArmor = function(unitId, equipId){
  var u = state.units.find(function(u){return u.id===unitId;});
  if(!u) return;
  var d = data();
  u.equipment = u.equipment.filter(function(id){ var e=d.equipment[id]; return !e || e.group!=='armor'; });
  if(equipId){
    var e = d.equipment[equipId];
    if(!factionOk(e)){ renderAll(); return; }
    if(e.reqStrength && dieIdx(u.stats.might) < dieIdx(e.reqStrength)){ renderAll(); return; }
    u.equipment.push(equipId);
  }
  renderAll();
};

function renderUnit(u){
  var d = data(); var r = role(u); var c = computeUnit(u);
  var html = '<div class="unit">';
  html += '<div class="unit-head">';
  html += '<input class="uname" value="'+esc(u.name)+'" oninput="App.renameUnit(\''+u.id+'\',this.value)">';
  html += '<span class="role-tag">'+r.name+'</span>';
  html += '<select class="size-select" onchange="App.setSize(\''+u.id+'\',this.value)">';
  for(var s=r.sizeMin; s<=r.sizeMax; s++) html += '<option value="'+s+'" '+(u.size===s?'selected':'')+'>Размер '+s+'</option>';
  html += '</select>';
  html += '<span class="unit-cost num">'+c.cost+' Изв.</span>';
  html += '<button class="btn small ghost" onclick="App.removeUnit(\''+u.id+'\')">Удалить</button>';
  html += '</div>';

  html += '<div class="unit-body">';

  html += '<div><div class="section-h">Параметры &middot; прокачек использовано '+c.increasesUsed+' / '+c.increasesAllowed+'</div><div class="stat-row">';
  STAT_KEYS.forEach(function(k){
    var baseline = (k==='might' && r.mightBaseline) ? r.mightBaseline : 'd6';
    var canDown = dieIdx(u.stats[k]) > dieIdx(baseline);
    var canUp = dieIdx(u.stats[k])<3 && c.increasesUsed < c.increasesAllowed;
    html += '<div class="stat-box"><div class="sname">'+STAT_LABELS[k]+'</div><div class="sval">'+fmtDie(u.stats[k])+'</div>'+
      '<div class="stepper"><button '+(canDown?'':'disabled')+' onclick="App.stepStat(\''+u.id+'\',\''+k+'\',-1)">&minus;</button>'+
      '<button '+(canUp?'':'disabled')+' onclick="App.stepStat(\''+u.id+'\',\''+k+'\',1)">+</button></div></div>';
  });
  html += '</div></div>';

  html += '<div class="derived-row">';
  html += '<div class="derived-box"><div class="dname">Защита</div><div class="dval num">'+c.defence+'</div></div>';
  html += '<div class="derived-box"><div class="dname">Броня</div><div class="dval num">'+c.armor+'</div></div>';
  html += '<div class="derived-box"><div class="dname">Здоровье</div><div class="dval num">'+c.health+'</div></div>';
  html += '<div class="derived-box"><div class="dname">Скорость</div><div class="dval num">'+c.speed+(r.speedCapped?' (потолок)':'')+'</div></div>';
  html += '</div>';

  if(r.builtinArmor || r.mightBaseline || r.builtinHealth){
    html += '<div class="note-inline">Встроено ролью: '+(r.mightBaseline?'стартовая Сила '+fmtDie(r.mightBaseline)+'; ':'')+(r.builtinArmor?'Броня +'+r.builtinArmor+'; ':'')+(r.builtinHealth?'Здоровье +'+r.builtinHealth+'; ':'')+(r.speedCapped?'Скорость никогда не растёт':'')+'</div>';
  }
  var arch = currentArchetype();
  if(arch.sizeBonusRule && u.size===arch.sizeBonusRule.size){
    html += '<div class="note-inline">«Неостановимая сила» (Размер '+arch.sizeBonusRule.size+'): доп. Броня +'+(arch.sizeBonusRule.armor||0)+', Здоровье +'+(arch.sizeBonusRule.health||0)+' — уже учтено выше.</div>';
  }

  html += '<div class="two-col">';
  html += '<div><div class="section-h">Способности архетипа ('+u.archetypeAbilities.length+'/'+r.archetypeAbilitySlots+')</div><div class="check-list">';
  if(r.archetypeAbilitySlots===0){ html += '<div class="note-inline" style="padding:6px;">Эта роль не получает способностей.</div>'; }
  else {
    var cats = roleCategories(r);
    cats.forEach(function(cat){
      Object.keys(d.abilities).forEach(function(aid){
        var ab = d.abilities[aid];
        if(ab.category!==cat) return;
        var checked = u.archetypeAbilities.indexOf(aid)!==-1;
        var full = u.archetypeAbilities.length >= r.archetypeAbilitySlots;
        html += abilityCheckItem(u.id,'archetype',aid,ab,checked, full, full?'Все слоты способностей заняты':'', cats.length>1);
      });
    });
  }
  if(r.note){ html += '<div class="note-inline" style="padding:4px 2px;">'+esc(r.note)+'</div>'; }
  html += '</div></div>';

  html += '<div><div class="section-h">Способность любой категории ('+u.anyAbilities.length+'/'+r.anyAbilitySlots+')</div><div class="check-list">';
  if(r.anyAbilitySlots===0){ html += '<div class="note-inline" style="padding:6px;">Эта роль не получает такой слот.</div>'; }
  else {
    Object.keys(d.abilities).forEach(function(aid){
      var ab = d.abilities[aid];
      var checked = u.anyAbilities.indexOf(aid)!==-1;
      var full = u.anyAbilities.length >= r.anyAbilitySlots;
      html += abilityCheckItem(u.id,'any',aid,ab,checked, full, full?'Слот занят':'', true);
    });
  }
  html += '</div></div>';
  html += '</div>';

  html += '<div class="two-col">';
  html += '<div><div class="section-h">Дальнобойное оружие</div><div class="check-list">';
  Object.keys(d.weapons).forEach(function(wid){
    var w = d.weapons[wid]; if(w.kind!=='ranged') return; if(!factionOk(w)) return;
    var checked = u.rangedWeapons.indexOf(wid)!==-1;
    var reasons = [];
    var strOk = !w.reqStrength || dieIdx(u.stats.might) >= dieIdx(w.reqStrength);
    if(!strOk) reasons.push('нужна Сила '+fmtDie(w.reqStrength));
    var uniqueOk = true;
    if(w.uniqueMax){ var used=0; state.units.forEach(function(uu){ if(uu.rangedWeapons.indexOf(wid)!==-1) used++; }); uniqueOk = checked || used<w.uniqueMax; if(!uniqueOk) reasons.push('лимит '+w.uniqueMax+' на отряд исчерпан'); }
    var disabled = !checked && (!strOk || !uniqueOk);
    html += '<label class="check-item'+(disabled?' disabled':'')+'" title="'+esc(reasons.join('; '))+'">'+
      '<input type="checkbox" '+(checked?'checked':'')+' '+(disabled?'disabled':'')+' onchange="App.toggleWeapon(\''+u.id+'\',\'ranged\',\''+wid+'\',this.checked)">'+
      '<span><span class="it-name">'+esc(w.name)+'</span><span class="it-meta"> — дальн.'+w.range+'&Prime; урон '+w.damage+', '+w.traits.join(', ')+(w.uniqueMax?' [уник. '+w.uniqueMax+'/отряд]':'')+'</span></span>'+
      '<span class="cost-chip">'+w.cost+' Изв.</span></label>';
  });
  html += '</div></div>';

  html += '<div><div class="section-h">Оружие ближнего боя</div><div class="check-list">';
  html += '<div class="note-inline" style="padding:4px 6px;">Без выбора действует безоружная атака (дальн.1, урон1, Лёгкое).</div>';
  Object.keys(d.weapons).forEach(function(wid){
    var w = d.weapons[wid]; if(w.kind!=='melee') return; if(!factionOk(w)) return;
    var checked = u.meleeWeapons.indexOf(wid)!==-1;
    var reasons = [];
    var strOk = !w.reqStrength || dieIdx(u.stats.might) >= dieIdx(w.reqStrength);
    if(!strOk) reasons.push('нужна Сила '+fmtDie(w.reqStrength));
    var disabled = !checked && !strOk;
    html += '<label class="check-item'+(disabled?' disabled':'')+'" title="'+esc(reasons.join('; '))+'">'+
      '<input type="checkbox" '+(checked?'checked':'')+' '+(disabled?'disabled':'')+' onchange="App.toggleWeapon(\''+u.id+'\',\'melee\',\''+wid+'\',this.checked)">'+
      '<span><span class="it-name">'+esc(w.name)+'</span><span class="it-meta"> — дальн.'+w.range+'&Prime; урон '+w.damage+', '+w.traits.join(', ')+'</span></span>'+
      '<span class="cost-chip">'+w.cost+' Изв.</span></label>';
  });
  html += '</div></div>';
  html += '</div>';

  var curArmor = u.equipment.find(function(id){ var e=d.equipment[id]; return e && e.group==='armor'; }) || '';
  html += '<div class="two-col">';
  html += '<div><div class="section-h">Защитное снаряжение</div>';
  html += '<select class="armor-select" onchange="App.setArmor(\''+u.id+'\',this.value)"><option value="">— нет —</option>';
  Object.keys(d.equipment).forEach(function(eid){
    var e = d.equipment[eid]; if(e.group!=='armor') return; if(!factionOk(e) && curArmor!==eid) return;
    var strOk = !e.reqStrength || dieIdx(u.stats.might) >= dieIdx(e.reqStrength);
    html += '<option value="'+eid+'" '+(curArmor===eid?'selected':'')+' '+(!strOk?'disabled':'')+'>'+esc(e.name)+' (Броня +'+e.armorBonus+', '+e.cost+' Изв.'+(!strOk?', нужна Сила '+fmtDie(e.reqStrength):'')+')</option>';
  });
  html += '</select></div>';

  html += '<div><div class="section-h">Прочее снаряжение</div><div class="check-list">';
  Object.keys(d.equipment).forEach(function(eid){
    var e = d.equipment[eid]; if(e.group==='armor') return; if(!factionOk(e)) return;
    var checked = u.equipment.indexOf(eid)!==-1;
    var reasons = [];
    var strOk = !e.reqStrength || dieIdx(u.stats.might) >= dieIdx(e.reqStrength);
    if(!strOk) reasons.push('нужна Сила '+fmtDie(e.reqStrength));
    var uniqueOk = true;
    if(e.uniqueMax){ var used=0; state.units.forEach(function(uu){ if(uu.equipment.indexOf(eid)!==-1) used++; }); uniqueOk = checked || used<e.uniqueMax; if(!uniqueOk) reasons.push('лимит '+e.uniqueMax+' на отряд исчерпан'); }
    var disabled = !checked && (!strOk || !uniqueOk);
    html += '<label class="check-item'+(disabled?' disabled':'')+'" title="'+esc(reasons.join('; '))+'">'+
      '<input type="checkbox" '+(checked?'checked':'')+' '+(disabled?'disabled':'')+' onchange="App.toggleEquipment(\''+u.id+'\',\''+eid+'\',this.checked)">'+
      '<span><span class="it-name">'+esc(e.name)+'</span><span class="it-meta"> — '+esc(e.text||'')+(e.uniqueMax?' [уник. '+e.uniqueMax+'/отряд]':'')+'</span></span>'+
      '<span class="cost-chip">'+e.cost+' Изв.</span></label>';
  });
  html += '</div></div>';
  html += '</div>';

  html += '<div class="unit-foot"><span class="slot-meter'+(c.slotsUsed>c.slotsCap?' over':'')+'">Слоты инвентаря: '+c.slotsUsed+' / '+c.slotsCap+'</span>'+
    '<span class="note-inline">Уровень '+r.level+'</span></div>';

  html += '</div></div>';
  return html;
}

function renderRulesCard(){
  var d = data(); var a = currentArchetype();
  var html = '<div class="card"><h3 style="font-size:16px;margin-bottom:8px;">Спецправила архетипа «'+esc(a.name)+'»</h3>'+
    (a.blurb ? '<div class="note-inline" style="padding:0 0 8px;">'+esc(a.blurb)+'</div>' : '')+
    '<div class="rule-list">';
  (a.specialRules||[]).forEach(function(r){ html += '<div><b>'+esc(r.name)+'</b> — '+esc(r.text)+'</div>'; });
  html += '</div></div>';

  html += '<div class="card"><h3 style="font-size:16px;margin-bottom:8px;">Справочник спецправил оружия</h3><dl class="glossary-grid">';
  Object.keys(d.glossary).forEach(function(gid){ var g=d.glossary[gid]; html += '<dt>'+esc(g.name)+'</dt><dd>'+esc(g.text)+'</dd>'; });
  html += '</dl></div>';

  html += '<div class="card"><h3 style="font-size:16px;margin-bottom:8px;">Допущения билдера (стоит свериться с автором правил)</h3><div class="rule-list" style="font-size:12.5px;color:var(--text-muted);">'+
    '<div>Тяжёлый Ветеран считается «Ветераном» для лимита Новобранцев и для спецправил «Специалисты широкого профиля» / «Цепочка командования».</div>'+
    '<div>Лимиты на дальнобойное и ближнее Двуручное оружие независимы — можно одновременно нести двуручное дальнобойное и двуручное ближнего боя.</div>'+
    '<div>Здоровье от «достижения д8/д12 в базовом параметре» считается отдельно для каждого параметра (кумулятивно), а не один раз за профиль.</div>'+
    '<div>Броня, рюкзак, мультитул и подобное «пассивное» снаряжение не занимает слот инвентаря, если это не указано явно в тексте предмета.</div>'+
    '</div></div>';
  return html;
}

function renderAll(){
  var el = document.getElementById('view-builder');
  el.innerHTML = renderSummary() + renderToolbar() +
    '<div style="display:flex;flex-direction:column;gap:14px;">' + state.units.map(renderUnit).join('') + '</div>' +
    (state.units.length===0 ? '<div class="empty-note">Пока никого нет — добавьте первого бойца кнопкой выше.</div>' : '') +
    renderRulesCard();
}

/* ---------------------------------------------------------- MY SQUADS ---- */

App.setIdentityField = function(field, val){
  identity[field] = val;
  persistIdentity();
};

App.refreshMySquads = function(){ loadMySquads(); };

App.saveSquad = function(){
  if(!API_URL){ alert('API не настроен (пустой API_URL) — сохранение отрядов недоступно. См. README.'); return; }
  if(!identity.name || !identity.code){ alert('Впишите имя и код доступа вверху вкладки «Мои отряды» (можно любые — это ваш личный ключ для сохранённых отрядов).'); App.setTab('mine'); return; }
  var payload = {
    action:'saveSquad', id: state.squadId||undefined, ownerName: identity.name, accessCode: identity.code,
    squadName: state.squadName, archetype: state.archetype, budget: state.budget, units: state.units
  };
  apiPost(payload).then(function(res){
    if(!res.ok){ alert('Не удалось сохранить: '+res.error); return; }
    state.squadId = res.result.id;
    persistHot();
    alert('Отряд «'+state.squadName+'» сохранён.');
    loadMySquads();
  }).catch(function(e){ alert('Не удалось связаться с сервером: '+e); });
};

App.newSquad = function(){
  if(!confirm('Начать новый пустой отряд? Несохранённые изменения текущего будут потеряны.')) return;
  state = { squadName:'Новый отряд', archetype:'organization', budget:60, units:[], squadId:null, tab:'builder' };
  persistHot(); renderAll();
};

App.loadSquad = function(id){
  var sq = mySquads.find(function(s){return s.id===id;});
  if(!sq) return;
  state.squadName = sq.squadName; state.archetype = sq.archetype||'organization'; state.budget = sq.budget||60;
  state.units = sq.units||[]; state.squadId = sq.id;
  persistHot();
  App.setTab('builder'); renderAll();
};

App.deleteSquad = function(id){
  if(!confirm('Удалить сохранённый отряд?')) return;
  apiPost({ action:'deleteSquad', id:id, ownerName:identity.name, accessCode:identity.code }).then(function(res){
    if(!res.ok){ alert('Не удалось удалить: '+res.error); return; }
    loadMySquads();
  }).catch(function(e){ alert('Не удалось связаться с сервером: '+e); });
};

function loadMySquads(){
  if(!API_URL || !identity.name || !identity.code){ mySquads = []; renderMine(); return; }
  apiPost({ action:'listSquads', ownerName:identity.name, accessCode:identity.code }).then(function(res){
    mySquads = (res.ok && res.squads) || [];
    renderMine();
  }).catch(function(){ mySquads = []; renderMine(); });
}

function renderMine(){
  var el = document.getElementById('view-mine');
  var html = '<div class="card"><h2 style="font-size:20px;margin-bottom:4px;">Мои отряды</h2>'+
    '<p class="note-inline" style="margin-bottom:10px;">Отряды сохраняются по паре «имя + код доступа» — придумайте любые и запоминайте их, это не настоящая регистрация. Тот, кто знает вашу пару, сможет открыть и изменить эти отряды.</p>'+
    '<div class="id-bar">'+
    '<input placeholder="Имя" value="'+esc(identity.name)+'" oninput="App.setIdentityField(\'name\',this.value)">'+
    '<input placeholder="Код доступа" value="'+esc(identity.code)+'" oninput="App.setIdentityField(\'code\',this.value)">'+
    '<button class="btn small" onclick="App.refreshMySquads()">Показать мои отряды</button>'+
    '</div></div>';

  if(!API_URL){
    html += '<div class="card empty-note">API не настроен — сохранение отрядов недоступно, пока не развёрнут Apps Script (см. README) и не вписан его URL в index.html.</div>';
  } else if(!identity.name || !identity.code){
    html += '<div class="card empty-note">Впишите имя и код доступа выше, затем нажмите «Показать мои отряды».</div>';
  } else if(mySquads.length===0){
    html += '<div class="card empty-note">Пока нет сохранённых отрядов под этой парой имя/код. Соберите отряд на вкладке «Билдер» и нажмите «Сохранить отряд».</div>';
  } else {
    html += '<div class="card"><div style="display:flex;flex-direction:column;gap:8px;">';
    mySquads.forEach(function(sq){
      var archName = (data().archetypes[sq.archetype]||{}).name || sq.archetype;
      html += '<div class="squad-row"><span class="sn">'+esc(sq.squadName||'Без названия')+'</span>'+
        '<span class="meta">'+esc(archName)+' &middot; '+(sq.units||[]).length+' бойцов &middot; бюджет '+(sq.budget||60)+'</span>'+
        '<button class="btn small" onclick="App.loadSquad(\''+sq.id+'\')">Открыть</button>'+
        '<button class="btn small ghost" onclick="App.deleteSquad(\''+sq.id+'\')">Удалить</button></div>';
    });
    html += '</div></div>';
  }
  el.innerHTML = html;
}

/* -------------------------------------------------------------- PRINT ---- */

App.printSquad = function(){
  var d = data();
  var w = window.open('', '_blank');
  if(!w){ alert('Браузер заблокировал всплывающее окно — разрешите всплывающие окна для печати.'); return; }
  var css = 'body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0;padding:24px;font-size:11pt;}'+
    'h1{font-size:20pt;margin:0 0 2mm 0;} .meta{color:#555;margin-bottom:8mm;}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:4mm;}'+
    'th,td{border:1px solid #999;padding:2mm 3mm;text-align:left;font-size:10pt;}'+
    'th{background:#222;color:#fff;}'+
    '.card{border:1.5px solid #222;border-radius:3mm;margin-bottom:6mm;overflow:hidden;break-inside:avoid;}'+
    '.chead{background:#222;color:#fff;padding:3mm 5mm;display:flex;justify-content:space-between;}'+
    '.cbody{padding:4mm 5mm;} ul{margin:2mm 0;padding-left:5mm;} li{margin-bottom:1.5mm;}'+
    '.sub{font-weight:bold;text-transform:uppercase;font-size:9pt;color:#444;margin:3mm 0 1mm;}'+
    '@page{size:A4;margin:14mm 12mm;}';
  var html = '<title>'+esc(state.squadName)+'</title><style>'+css+'</style><h1>'+esc(state.squadName)+'</h1>'+
    '<div class="meta">Архетип: Организация &middot; Известность: '+squadTotals().totalCost+' / '+state.budget+' &middot; Бойцов: '+state.units.length+'</div>';
  state.units.forEach(function(u){
    var c = computeUnit(u); var r = role(u);
    html += '<div class="card"><div class="chead"><b>'+esc(u.name)+'</b><span>'+r.name+' &middot; Размер '+u.size+' &middot; '+c.cost+' Изв.</span></div><div class="cbody">';
    html += '<table><tr>'+STAT_KEYS.map(function(k){return '<th>'+STAT_LABELS[k]+'</th>';}).join('')+'<th>Защита</th><th>Броня</th><th>Здоровье</th><th>Скорость</th></tr><tr>'+
      STAT_KEYS.map(function(k){return '<td>'+fmtDie(u.stats[k])+'</td>';}).join('')+'<td>'+c.defence+'</td><td>'+c.armor+'</td><td>'+c.health+'</td><td>'+c.speed+'</td></tr></table>';
    if(u.archetypeAbilities.length||u.anyAbilities.length){
      html += '<div class="sub">Способности</div><ul>';
      u.archetypeAbilities.concat(u.anyAbilities).forEach(function(aid){ var a=d.abilities[aid]; if(a) html += '<li><b>'+esc(a.name)+'</b> — '+esc(a.text)+'</li>'; });
      html += '</ul>';
    }
    var gear = u.rangedWeapons.concat(u.meleeWeapons, u.equipment);
    if(gear.length){
      html += '<div class="sub">Снаряжение</div><ul>';
      u.rangedWeapons.concat(u.meleeWeapons).forEach(function(wid){ var wp=d.weapons[wid]; if(wp) html += '<li><b>'+esc(wp.name)+'</b> — дальн.'+wp.range+'" урон '+wp.damage+', '+wp.traits.join(', ')+'</li>'; });
      u.equipment.forEach(function(eid){ var e=d.equipment[eid]; if(e) html += '<li><b>'+esc(e.name)+'</b>'+(e.text?' — '+esc(e.text):'')+'</li>'; });
      html += '</ul>';
    }
    html += '</div></div>';
  });
  w.document.write(html);
  w.document.close();
  setTimeout(function(){ try{ w.print(); }catch(e){} }, 300);
};

/* ------------------------------------------------------------ ESCAPING ---- */

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* --------------------------------------------------------------- INIT ---- */

document.addEventListener('click', function(e){
  var menu = document.getElementById('add-dropdown');
  if(menu && !menu.hidden && !e.target.closest('.add-menu')) menu.hidden = true;
});

function boot(){
  state = loadPersistedState() || defaultState();
  loadPersistedIdentity();
  renderDataBanner();
  renderAll();
  loadGameData();
}

function loadGameData(){
  if(!API_URL){ renderDataBanner(); return; }
  apiGet({ action:'data' }).then(function(res){
    if(res && res.ok && res.data){
      liveData = res.data;
      dataIsLive = true;
    } else {
      dataIsLive = false;
    }
    renderDataBanner();
    renderAll();
    loadMySquads();
  }).catch(function(){
    dataIsLive = false;
    renderDataBanner();
  });
}

boot();

})();
</script>
