<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Билдер отрядов Calamity City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#eef0e6; --surface:#ffffff; --surface-2:#e3e6d7; --surface-3:#d5d9c4;
    --border:#c4c9b0; --text:#1b1f14; --text-muted:#5e6350;
    --accent:#4f6b34; --accent-strong:#3c5427; --accent-ink:#f7f9ef;
    --warn:#8a6112; --warn-bg:#f5ead0; --danger:#a8341f; --danger-bg:#f6ded7;
    --good:#2f6b41; --good-bg:#dcead9;
    --shadow:0 1px 2px rgba(20,24,12,.08), 0 4px 14px rgba(20,24,12,.07);
    --radius:10px; --radius-sm:6px;
    --font-display:'Big Shoulders Display',system-ui,sans-serif;
    --font-body:'Public Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14170f; --surface:#1c2116; --surface-2:#242a1b; --surface-3:#2e3423;
      --border:#3b4130; --text:#eceee2; --text-muted:#9ba189;
      --accent:#8fbf62; --accent-strong:#a6d47d; --accent-ink:#12160c;
      --warn:#dba848; --warn-bg:#3a3117; --danger:#e2765a; --danger-bg:#3a211a;
      --good:#7fc496; --good-bg:#1e3325;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14170f; --surface:#1c2116; --surface-2:#242a1b; --surface-3:#2e3423;
    --border:#3b4130; --text:#eceee2; --text-muted:#9ba189;
    --accent:#8fbf62; --accent-strong:#a6d47d; --accent-ink:#12160c;
    --warn:#dba848; --warn-bg:#3a3117; --danger:#e2765a; --danger-bg:#3a211a;
    --good:#7fc496; --good-bg:#1e3325;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); padding-inline:16px; padding-block:0 32px; }
  h1,h2,h3{ font-family:var(--font-display); font-weight:800; text-wrap:balance; letter-spacing:.2px; margin:0; }
  .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  a{ color:var(--accent-strong); }
  button, select, input{ font-family:var(--font-body); font-size:14px; }
  button{ cursor:pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  [hidden]{ display:none!important; }

  .wrap{ max-width:1080px; margin:0 auto; }

  /* top bar */
  .topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding-block:14px 10px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .topbar-inner{ max-width:1080px; margin:0 auto; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  .brand{ font-size:22px; line-height:1; }
  .brand small{ display:block; font-family:var(--font-body); font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-top:3px; }
  .tabs{ display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; }
  .tab-btn{ border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px; padding:7px 14px; font-weight:600; font-size:13px; }
  .tab-btn[aria-selected="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  section.view{ display:flex; flex-direction:column; gap:18px; }

  /* summary strip */
  .summary{ display:grid; grid-template-columns:1.2fr repeat(5,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  @media (max-width:720px){ .summary{ grid-template-columns:1fr 1fr; } }
  .summary > div{ background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:4px; justify-content:center; }
  .summary .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); font-weight:600; }
  .summary .value{ font-family:var(--font-mono); font-size:19px; font-weight:600; }
  .summary .name-cell input{ font-family:var(--font-display); font-size:19px; font-weight:700; border:none; background:transparent; color:var(--text); padding:0; width:100%; }
  .summary .name-cell input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .pill{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; }
  .pill.good{ background:var(--good-bg); color:var(--good); }
  .pill.danger{ background:var(--danger-bg); color:var(--danger); }
  .pill.warn{ background:var(--warn-bg); color:var(--warn); }

  .issues{ display:flex; flex-direction:column; gap:6px; }
  .issue{ font-size:13px; padding:8px 12px; border-radius:var(--radius-sm); background:var(--warn-bg); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
  .issue.danger{ background:var(--danger-bg); color:var(--danger); }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn{ border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:var(--radius-sm); padding:8px 13px; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ background:var(--accent-strong); }
  .btn.ghost{ background:transparent; }
  .btn.small{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .add-menu{ position:relative; display:inline-block; }
  .add-dropdown{ position:absolute; top:calc(100% + 4px); left:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:var(--shadow); min-width:220px; z-index:30; padding:4px; }
  .add-dropdown button{ display:flex; justify-content:space-between; gap:8px; width:100%; text-align:left; border:none; background:transparent; padding:8px 10px; border-radius:var(--radius-sm); color:var(--text); font-size:13px; }
  .add-dropdown button:hover:not(:disabled){ background:var(--surface-2); }
  .add-dropdown button:disabled{ opacity:.4; cursor:not-allowed; }
  .add-dropdown .cap{ color:var(--text-muted); font-family:var(--font-mono); font-size:12px; }

  /* unit card */
  .unit{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .size-select{ border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:4px 6px; color:var(--text); font-family:var(--font-mono); }
  .unit-body{ padding:16px; display:flex; flex-direction:column; gap:16px; }

  /* sheet-style header */
  .sheet-head{ background:var(--surface-2); padding:12px 16px; display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; }
  .sh-cell{ display:flex; flex-direction:column; gap:3px; }
  .sh-label{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:700; }
  .sh-val{ font-family:var(--font-mono); font-weight:700; font-size:15px; }
  .sh-name{ flex:1 1 200px; }
  .sh-name input{ font-family:var(--font-display); font-weight:700; font-size:18px; background:transparent; border:none; color:var(--text); width:100%; padding:0; }
  .sh-name input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .sheet-head .btn{ margin-left:auto; }

  .sheet-body{ display:grid; grid-template-columns:160px minmax(0,1fr); gap:12px; }
  @media (max-width:640px){ .sheet-body{ grid-template-columns:minmax(0,1fr); } }
  .sheet-left{ display:flex; flex-direction:column; gap:8px; }
  .sheet-left .derived-box{ text-align:left; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 10px; }
  .derived-box.over .dval{ color:var(--danger); }
  .sheet-right{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; background:var(--surface); display:flex; flex-direction:column; gap:8px; min-width:0; }
  .gear-scroll{ overflow-x:auto; }
  .gear-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .gear-table th{ text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); border-bottom:1px solid var(--border); padding:4px 5px; }
  .gear-table td{ padding:4px 5px; border-bottom:1px solid var(--border); vertical-align:top; }
  .gear-table th, .gear-table td{ overflow-wrap:anywhere; }
  .gear-table tr:last-child td{ border-bottom:none; }
  .sheet-line{ font-size:12.5px; line-height:1.4; }

  .stat-row{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  @media (max-width:720px){ .stat-row{ grid-template-columns:repeat(3,1fr); } }
  .stat-box{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px; text-align:center; background:var(--surface); }
  .stat-box .sname{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600; }
  .stat-box .sval{ font-family:var(--font-mono); font-size:18px; font-weight:700; margin:4px 0; }
  .stat-box .stepper{ display:flex; justify-content:center; gap:4px; }
  .stepper button{ width:22px; height:22px; border-radius:5px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); line-height:1; font-weight:700; padding:0; }
  .stepper button:disabled{ opacity:.35; }

  .derived-box{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px; text-align:center; background:var(--surface-3); }
  .derived-box .dname{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600; }
  .derived-box .dval{ font-family:var(--font-mono); font-size:17px; font-weight:700; }

  .note-inline{ font-size:12px; color:var(--text-muted); }

  .section-h{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--text-muted); margin-bottom:6px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .two-col{ grid-template-columns:1fr; } }


  /* glossary / rules card */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
  .glossary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; font-size:12.5px; }
  @media (max-width:640px){ .glossary-grid{ grid-template-columns:1fr; } }
  .glossary-grid dt{ font-weight:700; margin-top:6px; }
  .glossary-grid dd{ margin:0 0 4px 0; color:var(--text-muted); }

  .rule-list{ display:flex; flex-direction:column; gap:8px; font-size:13px; }
  .rule-list b{ color:var(--text); }

  /* my squads */
  .squad-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); flex-wrap:wrap; }
  .squad-row .sn{ font-weight:700; flex:1 1 160px; }
  .squad-row .meta{ font-size:12px; color:var(--text-muted); font-family:var(--font-mono); }

  /* admin */
  .admin-entity{ display:grid; grid-template-columns:1.3fr .6fr 2fr; gap:8px; align-items:center; padding:8px 4px; border-bottom:1px solid var(--border); font-size:12.5px; }
  @media (max-width:640px){ .admin-entity{ grid-template-columns:1fr; } }
  .admin-entity input, .admin-entity select{ width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:5px 7px; background:var(--surface); color:var(--text); }
  .admin-group h3{ font-size:16px; margin:20px 0 6px; }
  .admin-group h3:first-child{ margin-top:0; }
  .save-bar{ position:sticky; bottom:0; background:var(--bg); padding-block:10px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:center; }

  .empty-note{ font-size:13px; color:var(--text-muted); padding:20px; text-align:center; }
  .footer-note{ font-size:11.5px; color:var(--text-muted); text-align:center; padding-top:10px; }
  .data-banner{ font-size:12.5px; padding:8px 12px; border-radius:var(--radius-sm); margin-bottom:10px; }
  .data-banner.offline{ background:var(--warn-bg); color:var(--warn); }

  /* edit actions (open picker modals) */
  .edit-actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .edit-armor{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* modal */
  .modal-overlay{ position:fixed; inset:0; background:rgba(20,24,12,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .modal-box{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); max-width:640px; width:100%; max-height:85vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:16px; }
  .modal-body{ padding:14px 16px 18px; overflow-y:auto; }
  .cost-chip{ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); white-space:nowrap; }

  /* accordion pickers */
  .acc-group{ border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; background:var(--surface); overflow:hidden; }
  .acc-children{ padding:6px 8px 8px 14px; display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--border); background:var(--surface-2); }
  .acc-item{ border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); overflow:hidden; }
  .modal-body > .acc-item{ margin-bottom:6px; }
  .acc-item.picked{ border-color:var(--accent); }
  .acc-head{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none; background:transparent; color:var(--text); padding:9px 10px; font-size:13.5px; }
  .acc-head:hover{ background:var(--surface-2); }
  .acc-chev{ color:var(--text-muted); width:12px; flex:none; }
  .acc-title{ font-weight:600; }
  .acc-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
  .acc-meta{ font-size:12px; color:var(--text-muted); }
  .acc-badge{ color:var(--accent-strong); font-weight:700; }
  .acc-body{ padding:4px 12px 12px 30px; display:flex; flex-direction:column; gap:8px; }
  .acc-text{ font-size:12.5px; line-height:1.45; color:var(--text-muted); }
  .acc-stats{ display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12.5px; }
  .acc-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .kw-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .kw{ font-size:12px; padding:2px 8px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border); cursor:help; }
  .kw.plain{ cursor:default; }
  .kw-cell .kw{ display:inline-block; margin:1px 4px 1px 0; }
  .kw-tip{ position:fixed; z-index:200; max-width:280px; background:var(--text); color:var(--bg); font-size:12px; line-height:1.4; padding:7px 10px; border-radius:var(--radius-sm); box-shadow:var(--shadow); pointer-events:none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">Билдер отрядов<small>Calamity City &middot; варгейм в разработке</small></div>
    <div class="tabs" role="tablist">
      <button class="tab-btn" data-tab="builder" onclick="App.setTab('builder')" aria-selected="true">Билдер</button>
      <button class="tab-btn" data-tab="mine" onclick="App.setTab('mine')" aria-selected="false">Мои отряды</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="data-banner"></div>
  <section class="view" id="view-builder"></section>
  <section class="view" id="view-mine" hidden></section>
  <p class="footer-note">Локальный инструмент для тестовых партий — не официальный релиз игры. Циферки и тексты правятся в общей Google Таблице; отряды у каждого свои (по имени и коду доступа).</p>
</div>

<div class="modal-overlay" id="modal-overlay" hidden onclick="if(event.target===this) App.closeModal()">
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="btn small ghost" id="modal-close-btn" onclick="App.closeModal()">&times;</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="kw-tip" id="kw-tip" hidden></div>

<script>
(function(){

/* ---------------------------------------------------------------- DATA ---- */

var DEFAULT_DATA = {
  archetypes: {
    organization: {
      id:'organization', name:'Организация',
      blurb:'Профессиональные оперативники: военные, агенты, наёмники, специалисты — полагаются на подготовку и снаряжение, а не на сверхспособности.',
      specialRules:[
        {name:'Сосредоточенные на миссии', text:'Когда персонаж Организации впервые за раунд успешно проходит проверку, связанную с миссией — отряд получает 1 Очко Мотивации.'},
        {name:'Специалисты широкого профиля', text:'Командир и Ветераны Организации могут выбрать ещё одну категорию способностей; для них она считается способностью архетипа (билдер это не считает автоматически — выбирайте вручную).'},
        {name:'Цепочка командования', text:'Пока Ветеран Организации в пределах 8" от Командира — он снижает сложность простых проверок Интеллекта и Воли на 1. Пока Новобранец в пределах 8" от Ветерана — то же самое.'}
      ],
      archetypeCategories:['Общие','Стратегия','Беспощадность','Точность'],
      roles:{
        commander:{ id:'commander', name:'Командир', tier:'senior', maxCount:1, sizeMin:1, sizeMax:2, defaultSize:2, cost:10, level:8, statIncreases:5, archetypeAbilitySlots:2, anyAbilitySlots:1 },
        veteran:{ id:'veteran', name:'Ветеран', tier:'senior', maxCount:3, sizeMin:1, sizeMax:2, defaultSize:2, cost:7, level:6, statIncreases:4, archetypeAbilitySlots:2, anyAbilitySlots:0 },
        heavyVeteran:{ id:'heavyVeteran', name:'Тяжёлый Ветеран', tier:'senior', maxCount:2, sizeMin:2, sizeMax:3, defaultSize:3, cost:8, level:6, statIncreases:3, archetypeAbilitySlots:2, anyAbilitySlots:0, builtinArmor:1, builtinHealth:2, mightBaseline:'d8', speedCapped:true },
        recruit:{ id:'recruit', name:'Новобранец', tier:'novice', maxCount:6, sizeMin:1, sizeMax:2, defaultSize:2, cost:3, level:3, statIncreases:2, archetypeAbilitySlots:0, anyAbilitySlots:0 }
      }
    },
    gifted: {
      id:'gifted', name:'Одарённые',
      blurb:'Мутанты, маги, вампиры, культисты, сверхлюди — их силы выходят далеко за пределы нормы человека.',
      specialRules:[
        {name:'Особая сила', text:'В начале фазы действия Командир/Ветеран может использовать способность Духовной силы или Манифестации без траты Очков Мотивации (без урона врагам; при переменной стоимости — как минимальная).'},
        {name:'Сверхъестественная связь', text:'Когда Командир/Ветеран впервые за раунд тратит Очки Мотивации — дружественный Новобранец в 12" получает Быстрое Ожидание.'},
        {name:'Пробуждение', text:'Когда Командир/Ветеран в свою активацию успешно применяет Сверхъестественную Силу — получает быстрое действие Взаимодействия.'},
        {name:'«Больше, чем человек» (порог)', text:'При 3+ способностях этой категории у персонажа — не может Взаимодействовать с нейтралами через проверки Воли. При 4+ — также не может Взаимодействовать с объектами через проверки Интеллекта.'}
      ],
      archetypeCategories:['Общие','Стратегия','Вдохновение','Больше чем человек','Духовные силы','Манифестация'],
      roles:{
        commander:{ id:'commander', name:'Командир', tier:'senior', maxCount:1, sizeMin:1, sizeMax:2, defaultSize:2, cost:15, level:9, statIncreases:5, archetypeAbilitySlots:3, anyAbilitySlots:1,
          archetypeCategories:['Общие','Стратегия','Вдохновение','Больше чем человек','Духовные силы','Манифестация'] },

function currentArchetype(){ return data().archetypes[state.archetype]; }
function role(unit){ return currentArchetype().roles[unit.roleId]; }
function roleCategories(r){ return r.archetypeCategories || currentArchetype().archetypeCategories; }
function archSlots(u,r){ return r.archetypeAbilitySlots + (u.bonusArchetype||0); }
function anySlots(u,r){ return r.anyAbilitySlots + (u.bonusAny||0); }

function statIncreasesUsed(unit){
  var d = data(); var r = role(unit); var used = 0;
  STAT_KEYS.forEach(function(k){
    var baseline = (k==='might' && r.mightBaseline) ? r.mightBaseline : 'd6';
    used += Math.max(0, dieIdx(unit.stats[k]) - dieIdx(baseline));
  });
  return used;
}

function weaponSlot(w){ return w.twohanded ? 2 : 1; }

/* ------------------------------------------------------------ ARSENAL ---- */
// Оружие/снаряжение хранится в state.arsenal как отдельные экземпляры
// {id, itemId, kind:'ranged'|'melee'|'equipment', ownerId:null|unitId}.
// Пока экземпляр не выдан персонажу (ownerId===null) — он не входит в Известность
// отряда, это «трофейный» запас. Один и тот же itemId может встречаться несколько
// раз — так на персонаже можно закрепить два одинаковых предмета.

function arsenalItemsOf(unitId, kind){
  return state.arsenal.filter(function(it){ return it.ownerId===unitId && (!kind || it.kind===kind); });
}
function catalogDef(it){ var d = data(); return it.kind==='equipment' ? d.equipment[it.itemId] : d.weapons[it.itemId]; }
function itemSlotCost(def, kind){ return kind==='equipment' ? (def.slot||0) : weaponSlot(def); }
function canEquip(def, unit){
  if(!factionOk(def)) return false;
  if(def.reqStrength && dieIdx(unit.stats.might) < dieIdx(def.reqStrength)) return false;
  return true;
}
// Причины, по которым юнит СЕЙЧАС не может нести ещё один экземпляр предмета.
// Лимита «рук»/двуручности больше нет (осознанное решение) — единственные
// ограничения: требование параметра, «не сочетается с другой бронёй» (это
// правило самого предмета, не рук) и нехватка слотов инвентаря. Ничего не
// вытесняется автоматически — если не помещается, просто нельзя взять.
function fitReasons(def, kind, unit){
  var reasons = [];
  if(def.reqStrength && dieIdx(unit.stats.might) < dieIdx(def.reqStrength)) reasons.push('нужна Сила '+fmtDie(def.reqStrength));
  if(def.group==='armor'){
    var hasArmor = arsenalItemsOf(unit.id,'equipment').some(function(x){ var od=data().equipment[x.itemId]; return od && od.group==='armor'; });
    if(hasArmor) reasons.push('уже есть другое защитное снаряжение — сначала уберите его');
  }
  var addSlots = itemSlotCost(def, kind);
  if(addSlots > 0){
    var c = computeUnit(unit);
    if(c.slotsUsed + addSlots > c.slotsCap) reasons.push('не хватит слотов инвентаря ('+c.slotsUsed+'/'+c.slotsCap+')');
  }
  return reasons;
}
function canEquipNow(def, kind, unit){
  return factionOk(def) && fitReasons(def, kind, unit).length===0;
}
function assignToUnit(it, unit){
  var def = catalogDef(it);
  if(!canEquipNow(def, it.kind, unit)) return false;
  it.ownerId = unit.id;
  return true;
}

function factionOk(item){ return !item.faction || item.faction===state.archetype; }

/* ---------------------------------------------------------------------- */

function computeUnit(unit){
  var d = data(); var r = role(unit); var arch = currentArchetype();
  var sizeBonus = (arch.sizeBonusRule && unit.size===arch.sizeBonusRule.size) ? arch.sizeBonusRule : null;
  var defence = 4;
  if(dieIdx(unit.stats.fight) >= 1) defence += 1;
  if(dieIdx(unit.stats.agility) >= 1) defence += 1;

  var ownedEquip = arsenalItemsOf(unit.id, 'equipment');
  var ownedWeapons = arsenalItemsOf(unit.id, 'ranged').concat(arsenalItemsOf(unit.id, 'melee'));

  var armor = (r.builtinArmor||0) + (sizeBonus ? (sizeBonus.armor||0) : 0);
  ownedEquip.forEach(function(it){ var e=d.equipment[it.itemId]; if(e){ if(e.group==='armor') armor += (e.armorBonus||0); if(e.armorBonusExtra) armor += e.armorBonusExtra; } });

  var health = 2 + (r.builtinHealth||0) + (sizeBonus ? (sizeBonus.health||0) : 0);
  STAT_KEYS.forEach(function(k){ var i=dieIdx(unit.stats[k]); if(i>=1) health+=1; if(i>=3) health+=1; });
  if(unit.size===1) health -= 1; if(unit.size===3) health += 1;
  unit.archetypeAbilities.concat(unit.anyAbilities).forEach(function(aid){ if(aid==='zdorovyak') health += 1; });

  var speed = r.speedCapped ? 5 : (5 + (dieIdx(unit.stats.agility)>=2?1:0));

  var slotsCap = 3;
  ownedEquip.forEach(function(it){ var e=d.equipment[it.itemId]; if(e && e.grantsSlot) slotsCap += e.grantsSlot; });
  unit.archetypeAbilities.concat(unit.anyAbilities).forEach(function(aid){ if(aid==='zdorovyak') slotsCap += 1; if(aid==='born_wrestler') slotsCap += 1; });

  // cost — полная Известность персонажа для показа на карточке/в печати: найм +
  // снаряжение + бесплатный рост от уровня (knownBonus). Это информационная
  // ценность бойца, а не то, что списывается с бюджета отряда (см. ниже —
  // бюджет теперь отдельный кошелёк, state.budget, который тратится в момент
  // покупки нового предмета/найма, а не пересчитывается из состава отряда).
  var slotsUsed = 0; var cost = r.cost;
  ownedWeapons.forEach(function(it){ var w=d.weapons[it.itemId]; if(w){ slotsUsed += weaponSlot(w); cost += w.cost; } });
  ownedEquip.forEach(function(it){ var e=d.equipment[it.itemId]; if(e){ slotsUsed += (e.slot||0); cost += (e.cost||0); } });
  cost += (unit.knownBonus||0);

  return { defence:defence, armor:armor, health:health, speed:speed, slotsCap:slotsCap, slotsUsed:slotsUsed, cost:cost,
    increasesUsed: statIncreasesUsed(unit), increasesAllowed: r.statIncreases + (unit.bonusStat||0) };
}

function squadTotals(){
  var d = data(); var totalCost = 0; var counts = {}; var seniorSum = 0; var noviceSum = 0;
  var uniqueUsage = {};
  var roles = currentArchetype().roles;
  state.units.forEach(function(u){
    var c = computeUnit(u);
    totalCost += c.cost;
    counts[u.roleId] = (counts[u.roleId]||0)+1;
    var r = roles[u.roleId];
    if(r){ if(r.tier==='senior') seniorSum++; if(r.tier==='novice') noviceSum++; }
  });
  state.arsenal.forEach(function(it){
    var def = catalogDef(it);
    if(def && def.uniqueMax) uniqueUsage[it.itemId] = (uniqueUsage[it.itemId]||0)+1;
  });
  // totalCost — суммарная Известность отряда: и покупки, и бесплатный рост от
  // уровней. Чисто информационная величина отряда, бюджет с ней не сравнивается.
  return { totalCost:totalCost, counts:counts, uniqueUsage:uniqueUsage, seniorSum:seniorSum, noviceSum:noviceSum };
}

function squadIssues(){
  var t = squadTotals(); var d = data(); var roles = currentArchetype().roles; var issues = [];
  var commanderCount = t.counts.commander||0;
  if(commanderCount !== 1) issues.push({level:'danger', text:'В отряде должен быть ровно 1 Командир (сейчас '+commanderCount+').'});
  Object.keys(roles).forEach(function(rid){
    var r = roles[rid]; var count = t.counts[rid]||0;
    if(count > r.maxCount) issues.push({level:'danger', text:'«'+r.name+'» больше лимита ('+r.maxCount+').'});
  });
  if(t.noviceSum > t.seniorSum) issues.push({level:'danger', text:'Новобранцев/Тяжёлых Новобранцев ('+t.noviceSum+') больше, чем Командир+Ветераны ('+t.seniorSum+').'});
  if(state.budget < 0) issues.push({level:'danger', text:'Бюджет отряда в минусе ('+state.budget+' Известности) — потрачено больше, чем было.'});
  Object.keys(t.uniqueUsage).forEach(function(id){
    var item = d.weapons[id] || d.equipment[id];
    if(item && t.uniqueUsage[id] > item.uniqueMax) issues.push({level:'danger', text:'«'+item.name+'» превышает лимит на отряд ('+item.uniqueMax+', включая арсенал).'});
  });
  state.units.forEach(function(u){
    var c = computeUnit(u);
    if(c.slotsUsed > c.slotsCap) issues.push({level:'warn', text:'«'+u.name+'»: занято слотов больше, чем есть ('+c.slotsUsed+'/'+c.slotsCap+').'});
    if(c.increasesUsed > c.increasesAllowed) issues.push({level:'warn', text:'«'+u.name+'»: потрачено больше прокачек, чем разрешено.'});
  });
  return issues;
}

  el.hidden = !el.hidden;
};

App.addUnit = function(roleId){
  var r = currentArchetype().roles[roleId];
  var stats = {}; STAT_KEYS.forEach(function(k){ stats[k] = (k==='might' && r.mightBaseline) ? r.mightBaseline : 'd6'; });
  var count = state.units.filter(function(u){return u.roleId===roleId;}).length;
  setState(function(s){
    s.units.push({ id:uid(), roleId:roleId, name:r.name+' '+(count+1), size:r.defaultSize, stats:stats,
      archetypeAbilities:[], anyAbilities:[],
      level:r.level, xp:0, bonusStat:0, bonusArchetype:0, bonusAny:0, knownBonus:0, heroicRoll:false });
    s.budget = (s.budget||0) - r.cost; // найм списывается с бюджета сразу
  });
  document.getElementById('add-dropdown').hidden = true;
};

App.removeUnit = function(id){
  if(!confirm('Убрать этого бойца из отряда?')) return;
  var removed = state.units.find(function(u){ return u.id===id; });
  var refund = removed ? (currentArchetype().roles[removed.roleId]||{}).cost||0 : 0;
  setState(function(s){
    s.budget = (s.budget||0) + refund; // возвращаем стоимость найма
    s.arsenal.forEach(function(it){ if(it.ownerId===id) it.ownerId = null; });
    s.units = s.units.filter(function(u){ return u.id!==id; });
  });
};

App.renameUnit = function(id, name){
  var u = state.units.find(function(u){return u.id===id;});
  if(u) u.name = name;
  persistHot();
};

App.setSize = function(id, size){
  var u = state.units.find(function(u){return u.id===id;});
  if(u) u.size = parseInt(size,10);
  persistHot();
  renderAll();
};

App.stepStat = function(id, key, dir){
  var u = state.units.find(function(u){return u.id===id;});
  if(!u) return;
  var r = role(u);
  var i = dieIdx(u.stats[key]);
  var baseline = (key==='might' && r.mightBaseline) ? r.mightBaseline : 'd6';
  if(dir>0){
    if(i>=3) return;
    if(statIncreasesUsed(u) >= r.statIncreases + (u.bonusStat||0)) return;
    u.stats[key] = DIE_ORDER[i+1];
  } else {
    if(dieIdx(u.stats[key]) <= dieIdx(baseline)) return;
    u.stats[key] = DIE_ORDER[i-1];
  }
  persistHot();
  renderAll();
};

App.setUnitXp = function(unitId, v){
  var u = state.units.find(function(uu){return uu.id===unitId;});
  var n = parseInt(v,10);
  if(u && !isNaN(n) && n>=0){ u.xp = n; persistHot(); renderAll(); }
};

App.transferXp = function(unitId, amount){
  var u = state.units.find(function(uu){return uu.id===unitId;});
  if(!u) return;
  amount = Math.min(amount, state.campaignXp||0);
  if(amount<=0) return;
  u.xp = (u.xp||0) + amount;
  state.campaignXp = (state.campaignXp||0) - amount;
  persistHot(); renderAll();
};

App.levelUp = function(unitId, choice){
  var u = state.units.find(function(uu){return uu.id===unitId;});
  if(!u) return;
  var lvl = unitLevel(u);
  var row = LEVEL_TABLE[lvl+1];
  if(!row) return;
  if((u.xp||0) < row.xp) return;
  var bonus = row.bonus;
  if(bonus==='choice'){
    if(choice!=='stat' && choice!=='ability') return;
    bonus = choice;
  }
  u.xp -= row.xp;
  u.level = lvl+1;
  u.knownBonus = (u.knownBonus||0) + row.known;
  if(bonus==='stat') u.bonusStat = (u.bonusStat||0)+1;
  else if(bonus==='ability') u.bonusArchetype = (u.bonusArchetype||0)+1;
  else if(bonus==='any') u.bonusAny = (u.bonusAny||0)+1;
  else if(bonus==='ability_heroic'){ u.bonusArchetype = (u.bonusArchetype||0)+1; u.heroicRoll = true; }
  persistHot();
  renderAll();
};

App.toggleAbility = function(unitId, slotType, abilityId, checked){
  var u = state.units.find(function(u){return u.id===unitId;});
  if(!u) return;
  var r = role(u);
  var list = slotType==='archetype' ? u.archetypeAbilities : u.anyAbilities;
  var maxSlots = slotType==='archetype' ? archSlots(u,r) : anySlots(u,r);
  var otherList = slotType==='archetype' ? u.anyAbilities : u.archetypeAbilities;
  if(checked){
    if(otherList.indexOf(abilityId)!==-1) return;
    if(list.length >= maxSlots) return;
    list.push(abilityId);
  } else {
    var idx = list.indexOf(abilityId);
    if(idx!==-1) list.splice(idx,1);
  }
  persistHot();
  renderAll();
};

// Создать новый экземпляр (списывает его стоимость с бюджета отряда и тратит
// уник.лимит предмета на весь отряд) и сразу выдать персонажу.
App.unitAddNew = function(unitId, kind, itemId){
  var u = state.units.find(function(uu){return uu.id===unitId;});
  if(!u) return;
  var d = data();
  var def = kind==='equipment' ? d.equipment[itemId] : d.weapons[itemId];
  if(!def || !canEquip(def, u)) return;
  if(def.uniqueMax){
    var total = state.arsenal.filter(function(x){ return x.itemId===itemId; }).length;
    if(total >= def.uniqueMax) return;
  }
  var it = { id:uid(), itemId:itemId, kind:kind, ownerId:null };
  if(!assignToUnit(it, u)) return; // не помещается (слоты/броня) — новый экземпляр никуда не попал
  state.arsenal.push(it);
  state.budget = (state.budget||0) - def.cost;
  persistHot(); renderAll();
};

// Взять уже существующий свободный экземпляр из арсенала отряда — он уже был
// оплачен при создании (unitAddNew/arsenalAdd), поэтому бюджет не трогаем и
// уник.лимит не проверяем повторно.
App.unitTakeFree = function(unitId, kind, itemId){
  var u = state.units.find(function(uu){return uu.id===unitId;});
  if(!u) return;
  var it = state.arsenal.find(function(x){ return x.ownerId===null && x.itemId===itemId; });
  if(!it) return;
  if(assignToUnit(it, u)){ persistHot(); renderAll(); }
};

// Снять с персонажа и удалить совсем — стоимость предмета возвращается в бюджет
// (иначе эксперименты при сборке отряда необратимо съедали бы бюджет).
App.unitRemoveItem = function(unitId, kind, itemId){
  for(var i=0;i<state.arsenal.length;i++){
    var it = state.arsenal[i];
    if(it.ownerId===unitId && it.kind===kind && it.itemId===itemId){
      var def = catalogDef(it);
      if(def) state.budget = (state.budget||0) + def.cost;
      state.arsenal.splice(i,1);
      break;
    }
  }
  persistHot(); renderAll();
};

// Снять с персонажа, но не выбрасывать — вернуть в общий (свободный) арсенал
// отряда. Предмет никуда не делся, поэтому бюджет не меняется.
App.unitStash = function(unitId, kind, itemId){
  var it = state.arsenal.find(function(x){ return x.ownerId===unitId && x.kind===kind && x.itemId===itemId; });
  if(it) it.ownerId = null;
  persistHot(); renderAll();
};

// Трофей/покупка в общий (пока никому не выданный) арсенал — тоже новое
// приобретение, поэтому списывается с бюджета сразу при создании, а не при
// выдаче персонажу (см. unitTakeFree/arsenalGive выше).
App.arsenalAdd = function(itemId, kind){
  var d = data();
  var def = kind==='equipment' ? d.equipment[itemId] : d.weapons[itemId];
  if(!def) return;
  if(def.uniqueMax){
    var total = state.arsenal.filter(function(it){ return it.itemId===itemId; }).length;
    if(total >= def.uniqueMax) return;
  }
  state.arsenal.push({ id:uid(), itemId:itemId, kind:kind, ownerId:null });
  state.budget = (state.budget||0) - def.cost;
  persistHot(); renderAll();
};

App.arsenalGive = function(instanceId, unitId){
  var it = state.arsenal.find(function(x){ return x.id===instanceId; });
  var u = state.units.find(function(x){ return x.id===unitId; });
  if(!it || !u) return;
  if(assignToUnit(it, u)){ persistHot(); renderAll(); }
};

App.arsenalDiscard = function(instanceId){
  if(!confirm('Выбросить предмет из арсенала?')) return;
  var it = state.arsenal.find(function(x){ return x.id===instanceId; });
  if(it){ var def = catalogDef(it); if(def) state.budget = (state.budget||0) + def.cost; }
  state.arsenal = state.arsenal.filter(function(x){ return x.id!==instanceId; });
  persistHot(); renderAll();
};

};

App.closeModal = function(){

  document.getElementById('modal-overlay').hidden = true;
};

function refreshModal(){

  renderModalContent();
}

            (w.traits.length ? '<div class="kw-row">'+kwChips(w.traits)+'</div>' : '')+

              'App.unitAddNew(\''+u.id+'\',\''+wKind+'\',\''+wid+'\')', 'App.unitTakeFree(\''+u.id+'\',\''+wKind+'\',\''+wid+'\')',
              'App.unitRemoveItem(\''+u.id+'\',\''+wKind+'\',\''+wid+'\')', 'App.unitStash(\''+u.id+'\',\''+wKind+'\',\''+wid+'\')')+'</div>';

        if(e.uniqueMax && totalInSquad>=e.uniqueMax) reasonsNew.push('лимит '+e.uniqueMax+' на отряд исчерпан');

        var open = !!modalExpanded['ar:'+eid];
        body += '<div class="acc-item'+(has ? ' picked' : '')+'">'+accHead('ar:'+eid, open, '<span class="acc-title">'+esc(e.name)+'</span>', (has ? '<span class="acc-badge">✓</span>' : '')+'<span class="cost-chip">'+e.cost+' Изв.</span>');

function accAction(has, reason, addCall, removeCall){
  if(has) return '<div class="acc-actions"><button class="btn small" onclick="'+removeCall+'">Убрать</button></div>';
  return '<div class="acc-actions"><button class="btn small primary" '+(reason ? 'disabled' : '')+' onclick="'+addCall+'">Добавить</button>'+(reason ? '<span class="note-inline">'+esc(reason)+'</span>' : '')+'</div>';

function qtyAction(count, freeCount, reasonNew, reasonTake, addNewCall, takeFreeCall, deleteCall, stashCall){
  var html = '<div class="acc-actions">';
  if(count>0){
    html += '<button class="btn small" onclick="'+deleteCall+'">Удалить</button>';
    html += '<button class="btn small ghost" onclick="'+stashCall+'">В арсенал</button>';
  }
  if(freeCount>0) html += '<button class="btn small" '+(reasonTake ? 'disabled' : '')+' onclick="'+takeFreeCall+'">Взять из арсенала ('+freeCount+')</button>';
  html += '<button class="btn small primary" '+(reasonNew ? 'disabled' : '')+' onclick="'+addNewCall+'">+ Добавить'+(count>0 ? ' ещё' : '')+'</button>';
  var msg = reasonNew || reasonTake;
  if(msg) html += '<span class="note-inline">'+esc(msg)+'</span>';
  html += '</div>';
  return html;
}

function glossaryFor(trait){
  var glossary = data().glossary || {};
  function baseName(s){ return String(s).replace(/\(.*$/, '').trim(); }
  var base = baseName(trait);
  var ids = Object.keys(glossary);
  for(var i=0; i<ids.length; i++){
    var g = glossary[ids[i]]; var gb = baseName(g.name);
    if(gb===base || (base.indexOf('Требует')===0 && gb.indexOf('Требует')===0)) return g;
  }
  return null;
}

function kwChips(traits){
  return traits.map(function(t){
    var g = glossaryFor(t); var tip = g ? g.name+' — '+g.text : '';
    return '<span class="kw'+(tip ? '' : ' plain')+'"'+(tip ? ' data-tip="'+esc(tip)+'" tabindex="0"' : '')+'>'+esc(t)+'</span>';
  }).join('');
}

// Имя предмета/способности с подсказкой (её же описание) по наведению — для уже
// выбранных вещей в сводке карточки (не только у ключевых слов оружия).
function nameChip(name, text){
  return '<span class="kw" data-tip="'+esc(name+(text ? ' — '+text : ''))+'" tabindex="0">'+esc(name)+'</span>';
}

// Находит упоминания ключевых слов справочника прямо в тексте способности
// (например "Оглушение", "Замедление", "Бронебойность(1)") и возвращает их
// список — используется и для подсветки в модалке, и для страницы-справочника
// при печати.
function keywordsInText(text){
  var glossary = data().glossary || {};
  var found = [];
  Object.keys(glossary).forEach(function(gid){
    var g = glossary[gid];
    var base = g.name.replace(/\(.*$/, '').trim();
    if(text.indexOf(base) !== -1 && found.indexOf(g)===-1) found.push(g);
  });
  return found;
}

// Оборачивает найденные в тексте ключевые слова в те же «пилюли» с подсказкой,
// остальной текст экранируется как обычно.
function highlightKeywords(text){
  var found = keywordsInText(text);
  if(!found.length) return esc(text);
  var bases = found.map(function(g){ return g.name.replace(/\(.*$/, '').trim(); }).sort(function(a,b){ return b.length-a.length; });
  var escapedBases = bases.map(function(b){ return b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); });
  var re = new RegExp('(' + escapedBases.join('|') + ')(\\([^)]{0,12}\\))?', 'g');
  var out = ''; var lastIndex = 0; var m;
  while((m = re.exec(text))){
    out += esc(text.slice(lastIndex, m.index));
    var full = m[0]; var base = m[1];
    var g = found.filter(function(gg){ return gg.name.replace(/\(.*$/,'').trim()===base; })[0];
    var tip = g ? (g.name+' — '+g.text) : full;
    out += '<span class="kw" data-tip="'+esc(tip)+'" tabindex="0">'+esc(full)+'</span>';
    lastIndex = re.lastIndex;
  }
  out += esc(text.slice(lastIndex));
  return out;
}

    (a.blurb ? '<div class="note-inline" style="padding:0 0 8px;">'+esc(a.blurb)+'</div>' : '')+
    '<div class="rule-list">';
  (a.specialRules||[]).forEach(function(r){ html += '<div><b>'+esc(r.name)+'</b> — '+esc(r.text)+'</div>'; });
  html += '</div></div>';

  html += '<div class="card"><h3 style="font-size:16px;margin-bottom:8px;">Справочник спецправил оружия</h3><dl class="glossary-grid">';
  Object.keys(d.glossary).forEach(function(gid){ var g=d.glossary[gid]; html += '<dt>'+esc(g.name)+'</dt><dd>'+esc(g.text)+'</dd>'; });
  html += '</dl></div>';
  return html;
}

function renderAll(){
  var el = document.getElementById('view-builder');
  el.innerHTML = renderSummary() + renderToolbar() +
    '<div style="display:flex;flex-direction:column;gap:14px;">' + state.units.map(renderUnit).join('') + '</div>' +
    (state.units.length===0 ? '<div class="empty-note">Пока никого нет — добавьте первого бойца кнопкой выше.</div>' : '') +
    renderRulesCard();
  refreshModal();
}

/* ---------------------------------------------------------- MY SQUADS ---- */

App.saveSquad = function(){
  if(!API_URL){ alert('API не настроен (пустой API_URL) — сохранение отрядов недоступно. См. README.'); return; }
  if(!identity.name || !identity.code){ App.openModal('login'); return; }
  var payload = {
    action:'saveSquad', id: state.squadId||undefined, ownerName: identity.name, accessCode: identity.code,
    squadName: state.squadName, archetype: state.archetype, budget: state.budget, units: state.units,
    arsenal: state.arsenal, campaignXp: state.campaignXp||0
  };
  apiPost(payload).then(function(res){
    if(!res.ok){ alert('Не удалось сохранить: '+res.error); return; }
    state.squadId = res.result.id;
    persistHot();
    alert('Отряд «'+state.squadName+'» сохранён.');
    loadMySquads();
  }).catch(function(e){ alert('Не удалось связаться с сервером: '+e); });
};

App.newSquad = function(){
  if(state.units.length>0 && !confirm('Начать новый пустой отряд? Несохранённые изменения текущего будут потеряны.')) return;
  newSquadDraft = { archetype:'organization', budget:60 };
  App.openModal('newSquad');
};

App.setNewSquadArchetype = function(v){
  var budgetInput = document.getElementById('new-squad-budget');
  if(budgetInput){ var n = parseInt(budgetInput.value,10); newSquadDraft.budget = isNaN(n) ? newSquadDraft.budget : n; }
  newSquadDraft.archetype = v;
  renderModalContent();
};

App.confirmNewSquad = function(){
  var budgetInput = document.getElementById('new-squad-budget');
  var n = budgetInput ? parseInt(budgetInput.value, 10) : NaN;
  var budget = (!isNaN(n) && n>=0) ? n : 60;
  var archetype = (newSquadDraft && data().archetypes[newSquadDraft.archetype]) ? newSquadDraft.archetype : 'organization';
  state = { squadName:'Новый отряд', archetype:archetype, budget:budget, units:[], arsenal:[], campaignXp:0, squadId:null, tab:'builder' };
  newSquadDraft = null;
  persistHot();
  App.closeModal();
  App.setTab('builder');
  renderAll();
};

App.loadSquad = function(id){
  var sq = mySquads.find(function(s){return s.id===id;});
  if(!sq) return;
  state.squadName = sq.squadName; state.archetype = sq.archetype||'organization'; state.budget = sq.budget||60;
  state.campaignXp = sq.campaignXp||0;
  state.units = (sq.units||[]).map(function(u){
    return {
      id:u.id, roleId:u.roleId, name:u.name, size:u.size, stats:u.stats,
      archetypeAbilities:u.archetypeAbilities||[], anyAbilities:u.anyAbilities||[],
      level:u.level, xp:u.xp||0, bonusStat:u.bonusStat||0, bonusArchetype:u.bonusArchetype||0, bonusAny:u.bonusAny||0,
      knownBonus:u.knownBonus||0, heroicRoll:!!u.heroicRoll
    };
  });
  // Экземпляры оружия/снаряжения; отряды старого формата (до появления арсенала)
  // хранили их прямо в массивах юнита — переносим их в арсенал при загрузке.
  state.arsenal = (sq.arsenal||[]).slice();
  (sq.units||[]).forEach(function(u){
    (u.rangedWeapons||[]).forEach(function(wid){ state.arsenal.push({id:uid(), itemId:wid, kind:'ranged', ownerId:u.id}); });
    (u.meleeWeapons||[]).forEach(function(wid){ state.arsenal.push({id:uid(), itemId:wid, kind:'melee', ownerId:u.id}); });
    (u.equipment||[]).forEach(function(eid){ state.arsenal.push({id:uid(), itemId:eid, kind:'equipment', ownerId:u.id}); });
  });
  state.squadId = sq.id;
  persistHot();
  App.setTab('builder'); renderAll();
};

App.deleteSquad = function(id){
  if(!confirm('Удалить сохранённый отряд?')) return;
  apiPost({ action:'deleteSquad', id:id, ownerName:identity.name, accessCode:identity.code }).then(function(res){
    if(!res.ok){ alert('Не удалось удалить: '+res.error); return; }
    loadMySquads();
  }).catch(function(e){ alert('Не удалось связаться с сервером: '+e); });
};

function loadMySquads(){
  if(!API_URL || !identity.name || !identity.code){ mySquads = []; renderMine(); return; }
  apiPost({ action:'listSquads', ownerName:identity.name, accessCode:identity.code }).then(function(res){
    mySquads = (res.ok && res.squads) || [];
    renderMine();
  }).catch(function(){ mySquads = []; renderMine(); });
}

function renderMine(){
  var el = document.getElementById('view-mine');
  var html = '<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">'+
    '<div><h2 style="font-size:20px;margin-bottom:4px;">Мои отряды</h2>'+
    '<p class="note-inline">Вы вошли как <b>'+esc(identity.name||'—')+'</b> &middot; <a href="#" onclick="App.openModal(\'login\');return false;">сменить</a></p></div>'+
    '<button class="btn primary" onclick="App.newSquad()">+ Создать отряд</button>'+
    '</div>';

  if(!API_URL){
    html += '<div class="card empty-note">API не настроен — сохранение отрядов недоступно, пока не развёрнут Apps Script (см. README) и не вписан его URL в index.html.</div>';
  } else if(!identity.name || !identity.code){
    html += '<div class="card empty-note">Впишите имя и код доступа во всплывающем окне входа.</div>';
  } else if(mySquads.length===0){
    html += '<div class="card empty-note">Пока нет сохранённых отрядов под этой парой имя/код. Нажмите «Создать отряд» и потом «Сохранить отряд» в билдере.</div>';
  } else {
    html += '<div class="card"><div style="display:flex;flex-direction:column;gap:8px;">';
    mySquads.forEach(function(sq){
      var archName = (data().archetypes[sq.archetype]||{}).name || sq.archetype;
      html += '<div class="squad-row"><span class="sn">'+esc(sq.squadName||'Без названия')+'</span>'+
        '<span class="meta">'+esc(archName)+' &middot; '+(sq.units||[]).length+' бойцов &middot; бюджет '+(sq.budget||60)+'</span>'+
        '<button class="btn small" onclick="App.loadSquad(\''+sq.id+'\')">Открыть</button>'+
        '<button class="btn small ghost" onclick="App.deleteSquad(\''+sq.id+'\')">Удалить</button></div>';
    });
    html += '</div></div>';
  }
  el.innerHTML = html;
}

/* -------------------------------------------------------------- PRINT ---- */

App.printSquad = function(){
  var d = data();
  var w = window.open('', '_blank');
  if(!w){ alert('Браузер заблокировал всплывающее окно — разрешите всплывающие окна для печати.'); return; }
  var css = 'body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0;padding:24px;font-size:11pt;}'+
    'h1{font-size:20pt;margin:0 0 2mm 0;} .meta{color:#555;margin-bottom:8mm;}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:4mm;}'+
    'th,td{border:1px solid #999;padding:2mm 3mm;text-align:left;font-size:10pt;}'+
    'th{background:#222;color:#fff;}'+
    '.card{border:1.5px solid #222;border-radius:3mm;margin-bottom:6mm;overflow:hidden;break-inside:avoid;}'+
    '.phead{background:#222;color:#fff;padding:3mm 5mm;display:flex;gap:6mm;flex-wrap:wrap;}'+
    '.phead div{display:flex;flex-direction:column;} .phead .plabel{font-size:7.5pt;text-transform:uppercase;letter-spacing:.05em;color:#bbb;}'+
    '.pstats{display:flex;gap:4mm;padding:3mm 5mm 0;flex-wrap:wrap;font-size:9.5pt;}'+
    '.cbody{padding:4mm 5mm;}'+
    '.pbody{display:flex;gap:5mm;}'+
    '.pleft{width:32mm;flex:none;display:flex;flex-direction:column;gap:2mm;font-size:9.5pt;}'+
    '.pleft div{border:1px solid #999;border-radius:1.5mm;padding:1.5mm 2.5mm;}'+
    '.pright{flex:1;min-width:0;}'+
    '.pright table{table-layout:fixed;} .pright th,.pright td{font-size:9pt;padding:1.5mm 2mm;overflow-wrap:anywhere;vertical-align:top;}'+
    '.sub{font-weight:bold;text-transform:uppercase;font-size:9pt;color:#444;margin:3mm 0 1mm;}'+
    '.ref-page{break-before:page;font-size:9pt;} .ref-page h1{font-size:15pt;} .ref-page .sub{margin:2mm 0 1mm;}'+
    '.ref-list{column-count:2;column-gap:6mm;margin-bottom:3mm;} .ref-list p{margin:0 0 1.5mm;break-inside:avoid;line-height:1.3;} .ref-page .cat{color:#666;font-size:8pt;}'+
    '@page{size:A4;margin:14mm 12mm;}';
  var arch = currentArchetype();
  var html = '<meta charset="utf-8"><title>'+esc(state.squadName)+'</title><style>'+css+'</style><h1>'+esc(state.squadName)+'</h1>'+
    '<div class="meta">Архетип: '+esc(arch.name)+' &middot; Известность отряда: '+squadTotals().totalCost+' &middot; Бюджет: '+state.budget+' &middot; Бойцов: '+state.units.length+' &middot; Опыт отряда: '+(state.campaignXp||0)+'</div>';
  if(arch.specialRules && arch.specialRules.length){
    html += '<div class="card"><div class="cbody"><div class="sub">Спецправила архетипа «'+esc(arch.name)+'»</div>';
    arch.specialRules.forEach(function(r){ html += '<p style="margin:0 0 1.5mm;font-size:9.5pt;line-height:1.35;"><b>'+esc(r.name)+'</b> — '+esc(r.text)+'</p>'; });
    html += '</div></div>';
  }
  state.units.forEach(function(u){
    var c = computeUnit(u); var r = role(u);
    html += '<div class="card">';
    html += '<div class="phead">'+
      '<div><span class="plabel">Имя</span><b>'+esc(u.name)+'</b></div>'+
      '<div><span class="plabel">Тип</span>'+esc(r.name)+'</div>'+
      '<div><span class="plabel">Размер</span>'+u.size+'</div>'+
      '<div><span class="plabel">Уровень</span>'+unitLevel(u)+'</div>'+
      '<div><span class="plabel">Опыт</span>'+(u.xp||0)+'</div>'+
      '<div><span class="plabel">Известность</span>'+c.cost+'</div>'+
      '</div>';
    html += '<div class="pstats">'+STAT_SHEET_ORDER.map(function(k){ return '<span>'+STAT_LABELS[k]+' ('+fmtDie(u.stats[k])+')</span>'; }).join('')+'</div>';
    html += '<div class="cbody"><div class="pbody">';
    html += '<div class="pleft">'+
      '<div>Защита ('+c.defence+')</div>'+
      '<div>Броня ('+c.armor+')</div>'+
      '<div>Здоровье ('+c.health+')</div>'+
      '<div>Скорость ('+c.speed+')</div>'+
      '<div>Инвентарь ('+c.slotsUsed+')/('+c.slotsCap+')</div>'+
      '</div>';
    html += '<div class="pright">';
    var gearWeapons = arsenalItemsOf(u.id,'ranged').concat(arsenalItemsOf(u.id,'melee'));
    html += '<table><colgroup><col style="width:24%"><col style="width:16%"><col style="width:13%"><col style="width:8%"><col style="width:39%"></colgroup><tr><th>Название</th><th>Тип</th><th>Дальность</th><th>Урон</th><th>Спецправила</th></tr>';
    if(gearWeapons.length===0){
      html += '<tr><td colspan="5">Безоружная атака — дальн.1" урон 1, Лёгкое</td></tr>';
    } else {
      gearWeapons.forEach(function(it){
        var wp = d.weapons[it.itemId]; if(!wp) return;
        html += '<tr><td>'+esc(wp.name)+'</td><td>'+(wp.kind==='ranged'?'Дальнобойное':'Ближний бой')+'</td><td>'+wp.range+'"</td><td>'+wp.damage+'</td><td>'+esc(wp.traits.join(', '))+'</td></tr>';
      });
    }
    html += '</table>';
    var gearNames = arsenalItemsOf(u.id,'equipment').map(function(it){ var e=d.equipment[it.itemId]; return e?e.name:null; }).filter(Boolean);
    html += '<div><b>Экипировка:</b> '+(gearNames.length?esc(gearNames.join(', ')):'—')+'</div>';
    var abilityNames = u.archetypeAbilities.concat(u.anyAbilities).map(function(aid){ var a=d.abilities[aid]; return a?a.name:null; }).filter(Boolean);
    html += '<div style="margin-top:2mm;"><b>Способности:</b> '+(abilityNames.length?esc(abilityNames.join(', ')):'—')+'</div>';
    html += '</div>'; // pright
    html += '</div></div>'; // pbody, cbody
    html += '</div>'; // card
  });

  var usedKw = []; var usedAbilities = []; var usedGear = [];
  state.units.forEach(function(u){
    arsenalItemsOf(u.id,'equipment').forEach(function(it){
      var eq = d.equipment[it.itemId];
      if(eq && eq.group!=='armor' && !eq.grantsSlot && usedGear.indexOf(it.itemId)===-1) usedGear.push(it.itemId);
    });
    arsenalItemsOf(u.id,'ranged').concat(arsenalItemsOf(u.id,'melee')).forEach(function(it){
      var wp = d.weapons[it.itemId]; if(!wp) return;
      wp.traits.forEach(function(t){
        var g = glossaryFor(t);
        if(g && g.name.indexOf('Требует')!==0 && usedKw.indexOf(g)===-1) usedKw.push(g);
      });
    });
    u.archetypeAbilities.concat(u.anyAbilities).forEach(function(aid){
      if(d.abilities[aid] && usedAbilities.indexOf(aid)===-1) usedAbilities.push(aid);
    });
  });
  usedAbilities.forEach(function(aid){
    keywordsInText(d.abilities[aid].text).forEach(function(g){
      if(g.name.indexOf('Требует')!==0 && usedKw.indexOf(g)===-1) usedKw.push(g);
    });
  });
  if(usedKw.length || usedAbilities.length || usedGear.length){
    html += '<div class="ref-page"><h1>Справочник ростера</h1>';
    if(usedKw.length){
      html += '<div class="sub">Ключевые слова</div><div class="ref-list">';
      usedKw.forEach(function(g){ html += '<p><b>'+esc(g.name)+'</b> — '+esc(g.text)+'</p>'; });
      html += '</div>';
    }
    if(usedAbilities.length){
      html += '<div class="sub">Способности</div><div class="ref-list">';
      usedAbilities.forEach(function(aid){ var a = d.abilities[aid]; html += '<p><b>'+esc(a.name)+'</b> <span class="cat">['+esc(a.category)+']</span> — '+esc(a.text)+'</p>'; });
      html += '</div>';
    }
    if(usedGear.length){
      html += '<div class="sub">Снаряжение</div><div class="ref-list">';
      usedGear.forEach(function(eid){ var e = d.equipment[eid]; html += '<p><b>'+esc(e.name)+'</b> — '+esc(e.text||'')+'</p>'; });
      html += '</div>';
    }
    html += '</div>';
  }
  w.document.write(html);
  w.document.close();
  setTimeout(function(){ try{ w.print(); }catch(e){} }, 300);
};

/* ------------------------------------------------------------ ESCAPING ---- */

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* --------------------------------------------------------------- INIT ---- */

document.addEventListener('click', function(e){
  var menu = document.getElementById('add-dropdown');
  if(menu && !menu.hidden && !e.target.closest('.add-menu')) menu.hidden = true;
});

function showKwTip(el){
  kwTip.textContent = el.getAttribute('data-tip');
  kwTip.hidden = false;
  var rc = el.getBoundingClientRect();
  var w = kwTip.offsetWidth, h = kwTip.offsetHeight;
  var left = Math.min(Math.max(8, rc.left + rc.width/2 - w/2), window.innerWidth - w - 8);
  var top = rc.top - h - 8; if(top < 8) top = rc.bottom + 8;
  kwTip.style.left = left+'px'; kwTip.style.top = top+'px';
}
document.addEventListener('mouseover', function(e){ var el = e.target.closest('.kw[data-tip]'); if(el) showKwTip(el); });
document.addEventListener('mouseout', function(e){ if(e.target.closest('.kw[data-tip]')) kwTip.hidden = true; });
document.addEventListener('click', function(e){ var el = e.target.closest('.kw[data-tip]'); if(el) showKwTip(el); else kwTip.hidden = true; });

document.addEventListener('keydown', function(e){
  if(e.key==='Escape') App.closeModal();
});

function boot(){
  state = loadPersistedState() || defaultState();
  if(!state.arsenal) state.arsenal = [];
  if(state.campaignXp===undefined) state.campaignXp = 0;
  loadPersistedIdentity();
  renderDataBanner();
  renderAll();
  App.setTab(state.tab || 'builder');
  loadGameData();
  if(!identity.name || !identity.code){ App.openModal('login'); }
}

function loadGameData(){
  if(!API_URL){ renderDataBanner(); return; }
  apiGet({ action:'data' }).then(function(res){
    if(res && res.ok && res.data){
      liveData = res.data;
      dataIsLive = true;
    } else {
      dataIsLive = false;
    }
    renderDataBanner();
    renderAll();
    loadMySquads();
  }).catch(function(){
    dataIsLive = false;
    renderDataBanner();
  });
}

boot();


})();
